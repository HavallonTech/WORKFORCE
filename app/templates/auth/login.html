<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WorkForce Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.45)
                ),
                url(
                    "{{ url_for('static', filename='images/background.jpeg') }}"
                );

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

            min-height: 100vh;

        }

        .login-card {

            background: rgba(
                255,
                255,
                255,
                0.20
            );

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            border-radius: 20px;

            border: 1px solid rgba(
                255,
                255,
                255,
                0.3
            );

            overflow: hidden;

        }

        .login-card .card-header {

            background: rgba(
                13,
                110,
                253,
                0.85
            ) !important;

            border: none;

        }

        .login-card .card-body {

            color: white;

        }

        .login-card .form-control {

            background: rgba(
                255,
                255,
                255,
                0.85
            );

            border: none;

        }

        .login-card .form-control:focus {

            box-shadow: 0 0 10px rgba(
                255,
                255,
                255,
                0.5
            );

        }

        .login-card .card-footer {

            background: rgba(
                255,
                255,
                255,
                0.10
            );

            color: white;

            border: none;

        }

        .brand-title {

            font-weight: bold;

            letter-spacing: 1px;

        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-4">

            <div class="card login-card shadow-lg">

                <div class="card-header text-center text-white">

                    <!-- Optional Logo -->
                    <!--
                    <img src="{{ url_for('static', filename='images/logo.png') }}"
                         width="80"
                         class="mb-2">
                    -->

                    <h3 class="brand-title">

                        WorkForce

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Username

                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Login

                        </button>

                    </form>

                </div>

                <div class="card-footer text-center">

                    WorkForce v1.0

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
