<nav class="top-navbar shadow-sm">

    <div class="d-flex align-items-center">

        <!-- Mobile Menu -->

        <button
            class="btn btn-light d-lg-none me-3"
            id="mobileMenuBtn">

            <i class="bi bi-list fs-4"></i>

        </button>

        <!-- Desktop Collapse -->

        <button
            class="btn btn-light d-none d-lg-inline me-3"
            id="toggleSidebar">

            <i class="bi bi-layout-sidebar"></i>

        </button>

        <div>

            <h5 class="mb-0">

                {% block page_title %}
                    WorkForce
                {% endblock %}

            </h5>

            <small class="text-muted">

                Welcome back,
                {{ current_user.full_name }}

            </small>

        </div>

    </div>

    <div class="d-flex align-items-center">

        <span
            class="me-3 text-muted d-none d-md-inline"
            id="currentDateTime">

        </span>

        <button
            class="btn btn-light position-relative me-3">

            <i class="bi bi-bell"></i>

            <span
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">

                0

            </span>

        </button>

        <a
            href="{{ url_for('main.profile') }}">

            {% if current_user.profile_image %}

            <img

                src="{{ url_for(
                    'static',
                    filename='uploads/profiles/' ~ current_user.profile_image
                ) }}"

                class="navbar-avatar">

            {% else %}

            <i
                class="bi bi-person-circle navbar-avatar-icon">

            </i>

            {% endif %}

        </a>

    </div>

</nav>
