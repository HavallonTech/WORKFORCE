{% extends "base.html" %}

{% block title %}
Edit Department
{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header">

        Edit Department

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">

                    Unit

                </label>

                <select
                    name="unit_id"
                    class="form-control"
                    required>

                    {% for unit in units %}

                    <option
                        value="{{ unit.id }}"
                        {% if unit.id == department.unit_id %}
                        selected
                        {% endif %}>

                        {{ unit.name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Department Name

                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ department.name }}"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Description

                </label>

                <textarea
                    name="description"
                    rows="4"
                    class="form-control">{{ department.description }}</textarea>

            </div>

            <button
                type="submit"
                class="btn btn-success">

                Update Department

            </button>

            <a href="{{ url_for('main.departments') }}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
