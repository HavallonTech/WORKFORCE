{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header bg-primary text-white">

        Reset Password

    </div>

    <div class="card-body">

        <h5>

            {{ user.full_name }}

        </h5>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">

                    New Password

                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Confirm Password

                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-success">

                Reset Password

            </button>

        </form>

    </div>

</div>

{% endblock %}
