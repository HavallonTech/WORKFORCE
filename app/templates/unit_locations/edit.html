{% extends "base.html" %}

{% block title %}
Edit Location
{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header">

        Edit Unit Location

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label>Unit</label>

                <select
                    name="unit_id"
                    class="form-control"
                    required>

                    {% for unit in units %}

                    <option
                        value="{{ unit.id }}"
                        {% if unit.id == location.unit_id %}
                        selected
                        {% endif %}>

                        {{ unit.name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label>Location</label>

                <input
                    type="text"
                    name="name"
                    value="{{ location.name }}"
                    class="form-control"
                    required>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <label>Latitude</label>

                    <input
                        type="text"
                        name="latitude"
                        value="{{ location.latitude }}"
                        class="form-control"
                        required>

                </div>

                <div class="col-md-6">

                    <label>Longitude</label>

                    <input
                        type="text"
                        name="longitude"
                        value="{{ location.longitude }}"
                        class="form-control"
                        required>

                </div>

            </div>

            <br>

            <div class="mb-3">

                <label>Radius (Meters)</label>

                <input
                    type="number"
                    name="radius"
                    value="{{ location.radius }}"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-success">

                Update Location

            </button>

        </form>

    </div>

</div>

{% endblock %}
