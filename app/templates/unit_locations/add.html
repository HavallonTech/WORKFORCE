{% extends "base.html" %}

{% block title %}
Add Location
{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header">

        Add Unit Location

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label>Unit</label>

                <select
                    name="unit_id"
                    class="form-control"
                    required>

                    <option value="">
                        Select Unit
                    </option>

                    {% for unit in units %}

                    <option value="{{ unit.id }}">
                        {{ unit.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label>Location Name</label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    required>

            </div>

            <div class="row">

                <div class="col-md-6">

                    <label>Latitude</label>

                    <input
                        type="text"
                        name="latitude"
                        class="form-control"
                        required>

                </div>

                <div class="col-md-6">

                    <label>Longitude</label>

                    <input
                        type="text"
                        name="longitude"
                        class="form-control"
                        required>

                </div>

            </div>

            <br>

            <div class="mb-3">

                <label>Radius (Meters)</label>

                <input
                    type="number"
                    name="radius"
                    value="100"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-success">

                Save Location

            </button>

        </form>

    </div>

</div>

{% endblock %}
