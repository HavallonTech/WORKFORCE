<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Access Denied</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {

            background: linear-gradient(
                135deg,
                #0d6efd,
                #0a58ca
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .error-card {

            background: white;

            border-radius: 20px;

            padding: 40px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(
                0,
                0,
                0,
                0.2
            );

            max-width: 500px;

        }

        .error-code {

            font-size: 80px;

            font-weight: bold;

            color: #dc3545;

        }

    </style>

</head>

<body>

    <div class="error-card">

        <div class="error-code">

            403

        </div>

        <h2 class="mb-3">

            Access Denied

        </h2>

        <p class="text-muted">

            You do not have permission to access this page.

        </p>

        <a href="{{ url_for('main.dashboard') }}"
           class="btn btn-primary mt-3">

            Return to Dashboard

        </a>

    </div>

</body>

</html>
