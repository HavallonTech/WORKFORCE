{% extends "base.html" %}

{% block title %}
Field Attendance Check In
{% endblock %}

{% block content %}
<style>

#video {

    width: 100%;

    max-width: 450px;

    border-radius: 12px;

}

#preview {

    max-width: 300px;

    border-radius: 12px;

}

</style>

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <h3 class="mb-4 text-center">

                    Field Attendance

                </h3>

                <div class="card bg-primary text-black shadow-sm mb-4">

                    <div class="card-body text-center">

                    <h5 >

                        Punch {{ current_punch }}

                    </h5>

                    <strong>

                        Completed:

                    </strong>

                    {{ completed }}

                    /

                    8

                    <br>

                    <strong>

                        Remaining:

                    </strong>

                    {{ remaining }}

                </div>
                </div>
                <div class="text-center">

                    <video
                        id="video"
                        width="400"
                        height="300"
                        autoplay
                        class="border rounded">
                    </video>

                </div>

                <div class="text-center mt-3">

                    <button
                        type="button"
                        id="capture"
                        class="btn btn-primary btn-lg w-100">

                        <i class="bi bi-camera"></i>

                        Capture Selfie

                    </button>

                </div>

                <div class="text-center mt-3">

                    <canvas
                        id="canvas"
                        style="display:none;">
                    </canvas>

                    <img
                        id="preview"
                        class="img-thumbnail"
                        style="display:none; max-width:300px;">

                </div>
                <div class="alert alert-info text-center mb-3">

                    <strong>

                        GPS Status:

                    </strong>

                    <span id="gps-status">

                        Detecting location...

                    </span>

                </div>
                <form method="POST"
                      id="attendanceForm">
                      <div class="mb-3">

                        <label class="form-label">

                            Remarks

                        </label>

                        <textarea
                            name="remarks"
                            class="form-control"
                            rows="3"
                            placeholder="Optional remarks">
                        </textarea>

                    </div>

                    <input
                        type="hidden"
                        name="photo"
                        id="photo">

                    <input type="hidden"
                        name="latitude"
                        id="latitude">

                    <input type="hidden"
                        name="longitude"
                        id="longitude">

                    <div class="text-center mt-4">

                        <button
                            type="submit"
                            class="btn btn-success btn-lg w-100">

                            Submit Punch {{ current_punch }}

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<script>

const video =
    document.getElementById(
        "video"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const preview =
    document.getElementById(
        "preview"
    );

const photoInput =
    document.getElementById(
        "photo"
    );

navigator.mediaDevices
.getUserMedia({
    video: true
})
.then(function(stream){

    video.srcObject = stream;

})
.catch(function(error){

    alert(
        "Unable to access camera"
    );

});

document
.getElementById("capture")
.addEventListener(
    "click",
    function(){

        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;

        canvas
        .getContext("2d")
        .drawImage(
            video,
            0,
            0
        );

        const imageData =
            canvas.toDataURL(
                "image/jpeg"
            );

        photoInput.value =
            imageData;

        preview.src =
            imageData;

        preview.style.display =
            "block";

    }
);

document
.getElementById(
    "attendanceForm"
)
.addEventListener(
    "submit",
    function(e){

        if(
            photoInput.value === ""
        ){

            e.preventDefault();

            alert(
                "Please capture a selfie before checking in."
            );
        }

    }
);

navigator.geolocation.getCurrentPosition(

    function(position){

    document.getElementById(
        "latitude"
    ).value =
    position.coords.latitude;

    document.getElementById(
        "longitude"
    ).value =
    position.coords.longitude;

    document.getElementById(
        "gps-status"
    ).innerHTML =
    "🟢 Location detected";

},

    function(error){

        document.getElementById(
                "gps-status"
            ).innerHTML =
            "🔴 Location not detected";

    }

);

</script>

{% endblock %}
