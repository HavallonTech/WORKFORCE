{% extends "base.html" %}

{% block title %}
Edit Unit
{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header">

        Edit Unit

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="row">

                <div class="col-md-4">

                    <label>Code</label>

                    <input
                        value="{{ unit.code }}"
                        type="text"
                        name="code"
                        class="form-control"
                        required>

                </div>

                <div class="col-md-8">

                    <label>Name</label>

                    <input
                        value="{{ unit.name }}"
                        type="text"
                        name="name"
                        class="form-control"
                        required>

                </div>

            </div>

            <br>

            <label>Address</label>

            <textarea
                name="address"
                class="form-control">{{ unit.address }}</textarea>

            <br>

            <div class="row">

                <div class="col-md-6">

                    <label>Phone</label>

                    <input
                        value="{{ unit.phone }}"
                        type="text"
                        name="phone"
                        class="form-control">

                </div>

                <div class="col-md-6">

                    <label>Email</label>

                    <input
                        value="{{ unit.email }}"
                        type="email"
                        name="email"
                        class="form-control">

                </div>

            </div>

            <br>

            <button
                type="submit"
                class="btn btn-success">

                Update Unit

            </button>

        </form>

    </div>

</div>

{% endblock %}
