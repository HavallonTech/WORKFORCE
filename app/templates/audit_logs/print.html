<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>

        Audit Log Report

    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {

            padding: 20px;

            font-size: 12px;

        }

        .report-header {

            text-align: center;

            margin-bottom: 30px;

        }

        .report-header h2 {

            margin-bottom: 5px;

        }

        .report-info {

            margin-bottom: 20px;

        }

        table {

            width: 100%;

        }

        th {

            background-color: #f2f2f2 !important;

        }

        @media print {

            .no-print {

                display: none;

            }

        }

    </style>

</head>

<body>

    <div class="report-header">

        <h2>

            WorkForce Audit Log Report

        </h2>

        <p>
            Generated on:
            {{ generated_at }}
        </p>

    </div>

    <div class="report-info">

        <strong>

            Total Records:

        </strong>

        {{ logs|length }}

    </div>

    <div class="mb-3 no-print">

        <button
            onclick="window.print()"
            class="btn btn-primary">

            Print Report

        </button>

        <button
            onclick="window.close()"
            class="btn btn-secondary">

            Close

        </button>

    </div>

    <table class="table table-bordered table-sm">

        <thead>

            <tr>

                <th>

                    Date/Time

                </th>

                <th>

                    User

                </th>

                <th>

                    Module

                </th>

                <th>

                    Action

                </th>

                <th>

                    Details

                </th>

                <th>

                    IP Address

                </th>

            </tr>

        </thead>

        <tbody>

            {% for log in logs %}

            <tr>

                <td>

                    {{ log.created_at }}

                </td>

                <td>

                    {{ log.username }}

                </td>

                <td>

                    {{ log.module }}

                </td>

                <td>

                    {{ log.action }}

                </td>

                <td>

                    {{ log.details }}

                </td>

                <td>

                    {{ log.ip_address }}

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

    <script>

        window.onload = function() {

            window.print();

        };

    </script>

</body>

</html>
